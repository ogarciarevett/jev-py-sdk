[project]
name = "jev-py-sdk"
version = "0.1.0"
description = "Typed Jev judgments (noul / choice / score) from TypeSafe, masked before they leave the machine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar Garcia", email = "ogarciarevett@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ogarciarevett/jev-py-sdk"

[project.scripts]
jev = "jev_sdk.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["jev_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 94

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# black is the formatter of record; ruff lints.
[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
